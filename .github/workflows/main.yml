name: US Scanners

on:
  schedule:
    - cron: "50 14 * * 1-5"   # 한국 23:50 장중 점검 (미국 09:50, 서머타임 10:50)
    - cron: "10 22 * * 1-5"   # 한국 07:10 장 마감 후 확정
  workflow_dispatch:
    inputs:
      run_all:     { description: "✅ 전부 실행 (체크하면 아래 선택과 상관없이 16개 모두)", type: boolean, default: false }
      light:       { description: "신호등 (시장·ETF·그룹 RS)", type: boolean, default: false }
      ratio:       { description: "비교지표", type: boolean, default: false }
      etfvol:      { description: "ETF 거래량", type: boolean, default: false }
      rs:          { description: "RS 대시보드", type: boolean, default: false }
      trend:       { description: "트렌드 템플릿", type: boolean, default: false }
      vcp:         { description: "VCP", type: boolean, default: false }
      triangle:    { description: "업센딩 트라이앵글", type: boolean, default: false }
      bb:          { description: "볼린저밴드", type: boolean, default: false }
      ma:          { description: "이평선 (터치·돌파·장기 지지선)", type: boolean, default: false }
      delta:       { description: "거래량 델타 (15~20분)", type: boolean, default: false }
      pullback:    { description: "강세주 눌림목", type: boolean, default: false }
      island:      { description: "아일랜드 갭", type: boolean, default: false }
      earnings:    { description: "실적 플레이", type: boolean, default: false }
      bottoms:     { description: "바닥 패턴 (역헤드앤숄더·쌍바닥)", type: boolean, default: false }
      wedge:       { description: "폴링 웻지", type: boolean, default: false }
      base:        { description: "장기 베이스 (2년+ 컵앤핸들·박스)", type: boolean, default: false }
      force:       { description: "테스트 실행 (주말·장 시간과 상관없이 최근 거래일 기준)", type: boolean, default: true }
      diagnose:    { description: "진단할 티커 (VCP·삼각형·델타·눌림목·아일랜드·실적·바닥패턴·웻지·베이스, 예: NVDA, AAPL)", type: string, default: "" }

permissions:
  contents: write        # RS 대시보드 결과(docs, rs/data)를 저장소에 저장

concurrency:
  group: us-scanners-${{ github.event_name }}-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - { sys: light,    script: light.py,        secret: US_WEBHOOK_LIGHT,    close_only: false }
          - { sys: ratio,    script: ratio_watch.py,  secret: US_WEBHOOK_RATIO,    close_only: false }
          - { sys: etfvol,   script: etf_volume.py,   secret: US_WEBHOOK_ETFVOL,   close_only: true  }
          - { sys: rs,       script: rs.py,           secret: US_WEBHOOK_RS,       close_only: false }
          - { sys: trend,    script: trend.py,        secret: US_WEBHOOK_TREND,    close_only: false }
          - { sys: vcp,      script: vcp.py,          secret: US_WEBHOOK_VCP,      close_only: false }
          - { sys: triangle, script: triangle.py,     secret: US_WEBHOOK_TRIANGLE, close_only: false }
          - { sys: bb,       script: bb.py,           secret: US_WEBHOOK_BB,       close_only: false }
          - { sys: ma,       script: scanner.py,      secret: US_WEBHOOK_MA,       close_only: false }
          - { sys: delta,    script: delta.py,        secret: US_WEBHOOK_DELTA,    close_only: true  }
          - { sys: pullback, script: pullback.py,     secret: US_WEBHOOK_PULLBACK, close_only: false }
          - { sys: island,   script: island.py,       secret: US_WEBHOOK_ISLAND,   close_only: false }
          - { sys: earnings, script: earnings.py,     secret: US_WEBHOOK_EARNINGS, close_only: true  }
          - { sys: bottoms,  script: bottoms.py,      secret: US_WEBHOOK_BOTTOMS,  close_only: false }
          - { sys: wedge,    script: wedge.py,        secret: US_WEBHOOK_WEDGE,    close_only: false }
          - { sys: base,     script: base.py,         secret: US_WEBHOOK_BASE,     close_only: true  }
    steps:
      # 실행 여부: 수동이면 체크한 시스템만 (전부 실행 체크 시 모두) / 23:50 장중 회차에는 '마감된 날'만 보는 델타·ETF 거래량은 건너뜀
      - name: Decide
        id: go
        run: |
          RUN=1
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.run_all || inputs[matrix.sys] }}" != "true" ]; then RUN=0; fi
          elif [ "${{ github.event.schedule }}" = "50 14 * * 1-5" ] && [ "${{ matrix.close_only }}" = "true" ]; then
            RUN=0
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.go.outputs.run == '1'

      - uses: actions/setup-python@v5
        if: steps.go.outputs.run == '1'
        with:
          python-version: "3.12"
          cache: pip

      - if: steps.go.outputs.run == '1'
        run: pip install -r requirements.txt

      # 공통 목록(watchlist.txt, etfs.txt)을 각 시스템 폴더로 복사
      - if: steps.go.outputs.run == '1'
        run: cp watchlist.txt etfs.txt charts.py patternkit.py ${{ matrix.sys }}/

      # 차트(그림) 한글 글꼴
      - if: steps.go.outputs.run == '1' && contains(fromJSON('["light","etfvol","delta","earnings","bottoms","wedge","base"]'), matrix.sys)
        run: (sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum) > /dev/null || true

      # 시스템별 상태(재알림 방지, 종목 목록 캐시)를 다음 실행으로 넘김
      - uses: actions/cache@v4
        if: steps.go.outputs.run == '1'
        with:
          path: ${{ matrix.sys }}/state
          key: state-${{ matrix.sys }}-${{ github.run_id }}
          restore-keys: state-${{ matrix.sys }}-

      - name: Run ${{ matrix.sys }}
        if: steps.go.outputs.run == '1'
        working-directory: ${{ matrix.sys }}
        run: python ${{ matrix.script }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets[matrix.secret] }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '0' }}
          DIAGNOSE: ${{ contains(fromJSON('["vcp","triangle","delta","pullback","island","earnings","bottoms","wedge","base"]'), matrix.sys) && inputs.diagnose || '' }}
          RS_DOCS: ${{ github.workspace }}/docs

      # RS 대시보드 페이지(docs/)와 순위 기록(rs/data)을 저장소에 저장 → GitHub Pages가 새 페이지 게시
      - name: Save RS dashboard
        if: steps.go.outputs.run == '1' && matrix.sys == 'rs'
        run: |
          git config user.name "us-scanners-bot"
          git config user.email "us-scanners-bot@users.noreply.github.com"
          git add docs
          [ -d rs/data ] && git add rs/data
          git diff --cached --quiet || git commit -m "RS update $(date -u +%F)"
          git pull --rebase -q || true
          git push
