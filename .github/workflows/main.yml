name: US Scanners

on:
  schedule:
    - cron: "50 14 * * 1-5"   # 한국 23:50 장중 점검 (미국 09:50, 서머타임 10:50)
    - cron: "10 22 * * 1-5"   # 한국 07:10 장 마감 후 확정
  workflow_dispatch:
    inputs:
      system:
        description: "실행할 시스템 (all = 전부)"
        type: choice
        default: all
        options: [all, light, ratio, etfvol, rs, trend, vcp, triangle, bb, ma, delta, pullback, island]
      force:
        description: "테스트 실행 (주말·장 시간과 상관없이 최근 거래일 기준)"
        type: boolean
        default: true
      diagnose:
        description: "진단할 티커 (vcp·triangle·delta·pullback·island만, 예: NVDA, AAPL). 진단만 보려면 system도 하나만 고르세요"
        type: string
        default: ""

permissions:
  contents: write        # RS 대시보드 결과(docs, rs/data)를 저장소에 저장

concurrency:
  group: us-scanners-${{ github.event_name }}-${{ github.event.schedule || inputs.system }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - { sys: light,    script: light.py,        secret: US_WEBHOOK_LIGHT,    close_only: false }
          - { sys: ratio,    script: ratio_watch.py,  secret: US_WEBHOOK_RATIO,    close_only: false }
          - { sys: etfvol,   script: etf_volume.py,   secret: US_WEBHOOK_ETFVOL,   close_only: true  }
          - { sys: rs,       script: rs.py,           secret: US_WEBHOOK_RS,       close_only: false }
          - { sys: trend,    script: trend.py,        secret: US_WEBHOOK_TREND,    close_only: false }
          - { sys: vcp,      script: vcp.py,          secret: US_WEBHOOK_VCP,      close_only: false }
          - { sys: triangle, script: triangle.py,     secret: US_WEBHOOK_TRIANGLE, close_only: false }
          - { sys: bb,       script: bb.py,           secret: US_WEBHOOK_BB,       close_only: false }
          - { sys: ma,       script: scanner.py,      secret: US_WEBHOOK_MA,       close_only: false }
          - { sys: delta,    script: delta.py,        secret: US_WEBHOOK_DELTA,    close_only: true  }
          - { sys: pullback, script: pullback.py,     secret: US_WEBHOOK_PULLBACK, close_only: false }
          - { sys: island,   script: island.py,       secret: US_WEBHOOK_ISLAND,   close_only: false }
    steps:
      # 실행 여부: 수동이면 고른 시스템만 / 23:50 장중 회차에는 '마감된 날'만 보는 델타·ETF 거래량은 건너뜀
      - name: Decide
        id: go
        run: |
          RUN=1
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.system }}" != "all" ] && [ "${{ inputs.system }}" != "${{ matrix.sys }}" ]; then RUN=0; fi
          elif [ "${{ github.event.schedule }}" = "50 14 * * 1-5" ] && [ "${{ matrix.close_only }}" = "true" ]; then
            RUN=0
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.go.outputs.run == '1'

      - uses: actions/setup-python@v5
        if: steps.go.outputs.run == '1'
        with:
          python-version: "3.12"
          cache: pip

      - if: steps.go.outputs.run == '1'
        run: pip install -r requirements.txt

      # 공통 목록(watchlist.txt, etfs.txt)을 각 시스템 폴더로 복사
      - if: steps.go.outputs.run == '1'
        run: cp watchlist.txt etfs.txt charts.py ${{ matrix.sys }}/

      # 차트(그림) 한글 글꼴
      - if: steps.go.outputs.run == '1' && contains(fromJSON('["light","etfvol","delta"]'), matrix.sys)
        run: (sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum) > /dev/null || true

      # 시스템별 상태(재알림 방지, 종목 목록 캐시)를 다음 실행으로 넘김
      - uses: actions/cache@v4
        if: steps.go.outputs.run == '1'
        with:
          path: ${{ matrix.sys }}/state
          key: state-${{ matrix.sys }}-${{ github.run_id }}
          restore-keys: state-${{ matrix.sys }}-

      - name: Run ${{ matrix.sys }}
        if: steps.go.outputs.run == '1'
        working-directory: ${{ matrix.sys }}
        run: python ${{ matrix.script }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets[matrix.secret] }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '0' }}
          DIAGNOSE: ${{ contains(fromJSON('["vcp","triangle","delta","pullback","island"]'), matrix.sys) && inputs.diagnose || '' }}
          RS_DOCS: ${{ github.workspace }}/docs

      # RS 대시보드 페이지(docs/)와 순위 기록(rs/data)을 저장소에 저장 → GitHub Pages가 새 페이지 게시
      - name: Save RS dashboard
        if: steps.go.outputs.run == '1' && matrix.sys == 'rs'
        run: |
          git config user.name "us-scanners-bot"
          git config user.email "us-scanners-bot@users.noreply.github.com"
          git add docs
          [ -d rs/data ] && git add rs/data
          git diff --cached --quiet || git commit -m "RS update $(date -u +%F)"
          git pull --rebase -q || true
          git push
